name: Backend Staging Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 28-prod-01-azure-readiness
    paths:
      - "Backedn.Api/**"
      - ".github/workflows/backend-appservice-staging.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Backedn.Api/Backedn.Api.csproj

      - name: Build
        run: dotnet build Backedn.Api/Backedn.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Backedn.Api/Backedn.Api.csproj --configuration Release --output ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_BACKEND_APP_NAME_STAGING }}
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE_STAGING }}
          package: ./publish
